<!doctype html>
<!--
  Ascend 2.0 hub. GENERATED by tools/hub.py from workspace/<name>/data/ (do not hand-edit; rebuild).
  Self-contained and offline: the data is embedded below and the CSP forbids every network call, so
  nothing on this page can send workspace content anywhere.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ascend Hub</title>
<style>
  :root{--bg:#0b0f14;--panel:#121822;--panel2:#0f141c;--line:#1f2937;--txt:#e6edf3;--muted:#8b97a7;
    --accent:#5b9dff;--good:#36d399;--warn:#fbbf24;--bad:#f87171;--purple:#a78bfa;
    --mono:ui-monospace,Menlo,monospace;--sans:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--bg);color:var(--txt);font-family:var(--sans);line-height:1.5}
  .wrap{max-width:1120px;margin:0 auto;padding:28px 20px 80px}
  header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
  h1{font-size:26px;margin:0;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:13px}
  a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
  nav{display:flex;gap:6px;margin:22px 0 18px;border-bottom:1px solid var(--line)}
  nav button{background:none;border:0;color:var(--muted);font:600 14px var(--sans);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent}
  nav button[aria-selected=true]{color:var(--txt);border-bottom-color:var(--accent)}
  section[hidden]{display:none}
  h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:28px 0 12px;font-weight:600}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
  .stat .v{font:700 28px var(--mono)}.stat .l{color:var(--muted);font-size:12px}
  .funnel .row{display:grid;grid-template-columns:110px 1fr 60px;align-items:center;gap:12px;padding:5px 0}
  .bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
  .funnel .n{font-family:var(--mono);text-align:right}
  .banner{border:1px solid var(--warn);background:rgba(251,191,36,.08);border-radius:12px;padding:12px 14px;margin-top:14px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
  .tag{display:inline-block;font:600 11px var(--mono);padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
  .t-interview-invite,.t-screen,.t-onsite,.t-offer{color:var(--good);border-color:var(--good)}
  .t-rejection,.t-rejected{color:var(--bad);border-color:var(--bad)}
  .t-info-request,.t-assessment,.t-responded{color:var(--warn);border-color:var(--warn)}
  .t-recruiter-inbound{color:var(--purple);border-color:var(--purple)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chips button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:4px 10px;font:12px var(--sans);cursor:pointer}
  .chips button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
  .empty{color:var(--muted);font-style:italic}
  .due{font-family:var(--mono);color:var(--warn)}
  .act{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:3px 10px;font:12px var(--sans);cursor:pointer}
  .act:hover{border-color:var(--accent)} .t-approved{color:var(--good);border-color:var(--good)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Ascend Hub</h1><div class="sub" id="asOf"></div></div>
    <div class="sub"><a href="start-here.html">Start here</a></div>
  </header>
  <nav role="tablist">
    <button role="tab" aria-selected="true" data-tab="dash">Dashboard</button>
    <button role="tab" aria-selected="false" data-tab="queue">Queue</button>
    <button role="tab" aria-selected="false" data-tab="inbox">Inbox</button>
  </nav>

  <section id="dash">
    <div class="sub" id="runLine" style="margin-bottom:12px"></div>
    <div class="cards" id="week"></div>
    <div id="warning"></div>
    <h2>Needs a reply</h2><div class="panel" id="pinned"></div>
    <h2>Pipeline</h2><div class="panel funnel" id="funnel"></div>
    <h2>Rates</h2><div class="panel" id="rates"></div>
    <h2>Token spend</h2><div class="panel" id="tokens"></div>
  </section>

  <section id="queue" hidden>
    <div class="panel" id="sheet" hidden></div>
    <div class="panel"><table><thead><tr><th>#</th><th>Company</th><th>Role</th><th>Fit</th><th>Status</th><th></th></tr></thead><tbody id="queueRows"></tbody></table></div>
  </section>

  <section id="inbox" hidden>
    <div class="chips" id="chips"></div>
    <div class="panel"><table><thead><tr><th>Date</th><th>Type</th><th>Subject</th><th>Job</th><th></th></tr></thead><tbody id="inboxRows"></tbody></table></div>
  </section>
</div>

<script type="application/json" id="hub-data">{"__hub_data__": "replaced by tools/hub.py build"}</script>
<script>
const D = JSON.parse(document.getElementById("hub-data").textContent);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = v => /^https:\/\//i.test(String(v || "")) ? esc(v) : "#";
const $ = id => document.getElementById(id);
const LABEL = {"acknowledgement":"acknowledged","rejection":"rejected","info-request":"info request","assessment":"assessment",
  "interview-invite":"interview","status-update":"update","recruiter-inbound":"recruiter","job-alert":"job alert","other":"other"};

$("asOf").textContent = "Built " + D.as_of + " from your data files";

document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll("section").forEach(s => s.hidden = s.id !== b.dataset.tab);
}));

const w = D.week;
$("week").innerHTML = [["Applied", w.applied], ["Replies", w.replies], ["Interviews", w.interviews]]
  .map(([l, v]) => `<div class="stat"><div class="v">${esc(v)}</div><div class="l">${l} this week</div></div>`).join("");
if (D.warning) $("warning").innerHTML = `<div class="banner">${esc(D.warning)}</div>`;

$("pinned").innerHTML = D.pinned.length
  ? `<table><tbody>${D.pinned.map(p => `<tr><td class="due">due ${esc(p.due)}</td><td><span class="tag t-${esc(p.category)}">${esc(LABEL[p.category] || p.category)}</span></td><td>${esc(p.subject)}</td><td>${esc(p.job || "")}</td><td><a href="${safeUrl(p.gmail_url)}" target="_blank" rel="noopener noreferrer">Open</a></td></tr>`).join("")}</tbody></table>`
  : `<div class="empty">Nothing waiting on you.</div>`;

const maxCount = Math.max(1, ...D.funnel.map(s => s.count));
$("funnel").innerHTML = D.funnel.map(s =>
  `<div class="row"><div>${esc(s.stage)}</div><div class="bar"><i style="width:${(s.count / maxCount * 100).toFixed(1)}%"></i></div><div class="n">${esc(s.count)}</div></div>`).join("");

$("rates").innerHTML = D.rates.reply == null
  ? `<div class="empty">Rates appear after 10 applications. Below that a percentage is noise, so only counts are shown.</div>`
  : `<div class="cards"><div class="stat"><div class="v">${(D.rates.reply * 100).toFixed(0)}%</div><div class="l">reply rate</div></div><div class="stat"><div class="v">${(D.rates.ghost * 100).toFixed(0)}%</div><div class="l">no reply after 30 days</div></div></div>`;

$("tokens").innerHTML = D.tokens
  ? `<table><tbody>${Object.entries(D.tokens.by_stage).map(([k, v]) => `<tr><td>${esc(k)}</td><td style="font-family:var(--mono)">${esc(v.toLocaleString())}</td></tr>`).join("")}<tr><th>Total</th><th>${esc(D.tokens.total.toLocaleString())}</th></tr></tbody></table>`
  : `<div class="empty">No metered runs yet.</div>`;

const S = D.server || null;   // present only when ui/server.py serves the hub with a session token
if (D.run) {
  const e = D.run.estimate;
  $("runLine").textContent = `Engine ${D.run.engine} · ${D.run.mode} · about ${e.daily.toLocaleString()} tokens a day at ${e.jobs} applications (${e.basis === "measured" ? "from your runs" : "default estimate"})`;
}
const ACTIONABLE = new Set(["matched", "needs-you", "queued"]);
function queueRow(q) {
  const role = /^https:\/\//i.test(q.url || "") ? `<a href="${safeUrl(q.url)}" target="_blank" rel="noopener noreferrer">${esc(q.title)}</a>` : esc(q.title);
  const detail = [q.why, (q.gaps || []).length ? "Gaps: " + q.gaps.join("; ") : "", (q.reasons || []).join("; ")].filter(Boolean).join(" · ");
  let acts = "";
  if (S && q.posting_id && ACTIONABLE.has(q.status))
    acts = `<button class="act" data-id="${esc(q.posting_id)}" data-a="approved">Approve</button> <button class="act" data-id="${esc(q.posting_id)}" data-a="rejected">Reject</button>`;
  else if (S && q.posting_id && q.status === "approved")
    acts = `<button class="act" data-id="${esc(q.posting_id)}" data-a="sheet">Apply</button>`;
  return `<tr><td>${esc(q.nn || "")}</td><td>${esc(q.company)}</td><td>${role}${detail ? `<div class="sub">${esc(detail)}</div>` : ""}</td><td>${esc(q.fit == null ? "" : q.fit)}</td><td><span class="tag t-${esc(q.status)}">${esc(q.status)}</span></td><td>${acts}</td></tr>`;
}
$("queueRows").innerHTML = D.queue.length ? D.queue.map(queueRow).join("") : `<tr><td colspan="6" class="empty">No queued jobs yet.</td></tr>`;
const post = (path, body) => fetch(path, {method: "POST", headers: {"Content-Type": "application/json", "X-Ascend-Token": S.token},
                                          body: JSON.stringify(Object.assign({slug: S.slug}, body))}).then(r => r.json());
function showSheet(s, id) {
  const ans = Object.entries(s.answers || {}).map(([k, v]) => `${k}: ${v}`).join("\n");
  const open = `<a href="${safeUrl(s.apply_url)}" target="_blank" rel="noopener noreferrer">Open the application</a>`;
  const ask = (s.ask_user || []).length ? `<div class="banner">Only you can answer: ${esc(s.ask_user.join(", "))}. Ascend never fills these.</div>` : "";
  $("sheet").innerHTML = `<b>${esc(s.company)}: ${esc(s.title)}</b><div class="sub">Résumé: ${esc(String(s.resume_pdf).split("/").pop())}</div>${ask}
    <pre style="white-space:pre-wrap;background:var(--panel2);padding:10px;border-radius:8px">${esc(ans)}</pre>
    ${open} <button class="act" id="copyAns">Copy answers</button> <button class="act" data-id="${esc(id)}" data-a="applied">I submitted it</button>`;
  $("sheet").hidden = false;
  $("copyAns").onclick = () => navigator.clipboard && navigator.clipboard.writeText(ans);
  $("sheet").scrollIntoView({behavior: "smooth"});
}
document.querySelector("#queue").addEventListener("click", ev => {
  const b = ev.target.closest("button.act[data-a]"); if (!b || !S) return;
  if (b.dataset.a === "sheet") {
    post("/api/apply", {posting_id: b.dataset.id}).then(r => r.error ? showSheet({company: "Not ready", title: r.error, answers: {}, ask_user: []}, "") : showSheet(r, b.dataset.id));
    return;
  }
  b.disabled = true;
  post("/api/queue", {posting_id: b.dataset.id, action: b.dataset.a}).then(r => {
      if (b.dataset.a === "applied") { $("sheet").innerHTML = r.ok ? "Recorded as applied." : esc(r.error || "not saved"); return; }
      const row = b.closest("tr");
      if (r.ok) { row.querySelector(".tag").textContent = r.state; row.querySelector(".tag").className = "tag t-" + r.state; row.lastElementChild.innerHTML = ""; }
      else { b.disabled = false; row.lastElementChild.insertAdjacentHTML("beforeend", `<div class="sub">${esc(r.error || "not saved")}</div>`); }
    });
});

let filter = "jobs";
const isJob = i => !["other", "job-alert"].includes(i.category) || i.needs_llm;
function renderInbox() {
  const rows = D.inbox.filter(i => filter === "all" || (filter === "jobs" ? isJob(i) : i.category === filter));
  $("inboxRows").innerHTML = rows.length ? rows.map(i =>
    `<tr><td style="font-family:var(--mono)">${esc(i.date)}</td><td><span class="tag t-${esc(i.needs_llm ? "info-request" : i.category)}">${esc(i.needs_llm ? "to review" : (LABEL[i.category] || i.category))}</span></td><td>${esc(i.subject)}<div class="sub">${esc(i.from)}</div></td><td>${esc(i.job || "")}${i.due ? `<div class="due">due ${esc(i.due)}</div>` : ""}</td><td><a href="${safeUrl(i.gmail_url)}" target="_blank" rel="noopener noreferrer">Open</a></td></tr>`).join("")
    : `<tr><td colspan="5" class="empty">No mail in this view.</td></tr>`;
}
const cats = ["jobs", "all", ...new Set(D.inbox.map(i => i.category))];
$("chips").innerHTML = cats.map(c => `<button data-c="${esc(c)}" aria-pressed="${c === filter}">${esc(c === "jobs" ? "about my applications" : (LABEL[c] || c))}</button>`).join("");
$("chips").addEventListener("click", e => {
  const c = e.target.closest("button"); if (!c) return;
  filter = c.dataset.c;
  document.querySelectorAll("#chips button").forEach(b => b.setAttribute("aria-pressed", b === c));
  renderInbox();
});
renderInbox();
</script>
</body>
</html>
