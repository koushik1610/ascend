name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the smoke job only reads the repo (2026-07-02 council).
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      # Actions SHA-pinned (tags are mutable); the comment keeps the human-readable version.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Pin Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Pin Node (for the JS syntax check below)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # Without a TeX engine the renderer's highest-value assertions silently skip: the one-page
      # budget, selectable-text extraction, and the ToUnicode/ligature check that exists because
      # "first" once extracted as "rst" and killed ATS keyword matching. CI was green that whole
      # time (2026-08-20 council). ASCEND_REQUIRE_TEX makes a missing engine a failure, not a skip.
      - name: Install a TeX engine (so the résumé render assertions actually run)
        run: |
          sudo apt-get update -qq
          # The template needs geometry, iftex, fontenc/inputenc, helvet, microtype, setspace,
          # enumitem, xcolor and hyperref. enumitem and xcolor are NOT in latex-base+recommended
          # on this runner (the first run of this step failed on `\usepackage{xcolor}`), so
          # latex-extra is required too.
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended
          pdflatex --version | head -1
          # Resolve every package the template loads, so a future failure names the missing .sty
          # instead of leaving it to be guessed from a truncated LaTeX error.
          missing=0
          for sty in geometry iftex fontenc inputenc helvet microtype setspace enumitem xcolor hyperref; do
            if kpsewhich "$sty.sty" > /dev/null; then
              echo "  ok      $sty.sty"
            else
              echo "  MISSING $sty.sty"; missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo "::error::TeX packages missing (see MISSING lines above)"; exit 1; }

      - name: Smoke tests (server + reader security, perms, dashboards, gitignore, cross-refs, phase-order, scripts, résumé render)
        env:
          ASCEND_REQUIRE_TEX: "1"
        run: python3 tests/smoke.py

      # The committed sample is the golden fixture: it is the output a new user reads first, and the
      # only full run in the repo. Grading it with the same code that grades a real workspace means
      # the fixture and the rubric cannot drift apart, and a prompt change that degrades output has
      # somewhere to show up. Ten prompt-driven features just landed; nothing else tests their output.
      - name: Grade the committed sample against the v1.0 run rubric
        run: python3 tools/grade_run.py examples/sample-run

      - name: Validate dashboard render scripts (JS syntax)
        run: |
          set -e
          for f in templates/linkedin-analysis.template.html templates/start-here.template.html; do
            awk 'BEGIN{n=0}/<script>/{n++;if(n>=1){g=1;next}}/<\/script>/{g=0}g' "$f" > /tmp/render.js
            node --check /tmp/render.js && echo "JS ok: $f"
          done
